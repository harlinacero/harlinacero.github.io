# master: quality check, then publish to GitHub Pages. If the check fails, the deploy job
# never runs and the previously published version stays online (AC-27, AC-31).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Publish
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
